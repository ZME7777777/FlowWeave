<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#193126" flood-opacity=".13"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#1d2922}.muted{fill:#6d7b73}.mono{font-family:monospace;letter-spacing:1.4px}.title{font-size:27px;font-weight:700}.h{font-size:15px;font-weight:700}.label{font-size:11px;font-weight:700;fill:#526158}.small{font-size:11px}.value{font-size:13px}.tiny{font-size:10px}.field{fill:#fff;stroke:#cad7cf;stroke-width:1}.line{stroke:#d8e2dc;stroke-width:1}.btn{font-size:12px;font-weight:700}.white{fill:#fff}.green{fill:#176249}.box{fill:#fff;stroke:#d3ded7;stroke-width:1}.soft{fill:#f6f9f6}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#edf3ef"/>
  <rect width="1600" height="70" fill="#10261c"/>
  <rect x="42" y="18" width="34" height="34" rx="9" fill="#d5f64a"/><text x="59" y="42" text-anchor="middle" class="t" font-size="20" font-weight="700">F</text>
  <text x="92" y="42" class="white" font-family="Arial" font-size="24" font-weight="700">FlowWeave</text><text x="274" y="41" fill="#b7c8bd" font-family="Arial" font-size="13">Node assets  /  Edit node asset</text>
  <text x="1456" y="42" fill="#d5e1da" font-family="Arial" font-size="13">flowweave</text><rect x="1416" y="21" width="28" height="28" rx="7" fill="#315640"/><text x="1430" y="40" text-anchor="middle" fill="#d5f64a" font-family="Arial" font-size="14" font-weight="700">F</text>
  <text x="48" y="112" class="green mono" font-size="11" font-weight="700">NODE ASSET</text><text x="48" y="148" class="t title">Edit node asset</text><text x="48" y="174" class="muted" font-family="Arial" font-size="13">One editing surface for basic setup, context, inputs and outputs.</text>
  <rect x="1360" y="113" width="192" height="36" rx="7" fill="#f8fcf9" stroke="#c2d7c9"/><circle cx="1381" cy="131" r="5" fill="#54a36b"/><text x="1395" y="136" class="green" font-family="Arial" font-size="12">Draft autosaved</text>
  <g filter="url(#shadow)"><rect x="48" y="205" width="1504" height="790" rx="13" fill="#fff" stroke="#cbd8d0"/></g>
  <rect x="48" y="205" width="660" height="790" rx="13" fill="#fbfcfb"/><path d="M708 205V995" class="line"/>
  <!-- left: basic -->
  <text x="78" y="246" class="green mono" font-size="10" font-weight="700">01</text><text x="108" y="248" class="t h">Basic information</text><text x="108" y="267" class="muted small">Name and directory organize the node asset.</text>
  <text x="78" y="303" class="label">NODE NAME</text><rect x="78" y="312" width="397" height="39" rx="6" class="field"/><text x="91" y="337" class="t value">Batch code repair</text>
  <text x="492" y="303" class="label">DIRECTORY</text><rect x="492" y="312" width="184" height="39" rx="6" class="field"/><text x="504" y="337" class="t small">Flow A / Exceptions</text><text x="658" y="336" class="muted tiny">⌄</text>
  <text x="78" y="379" class="label">DESCRIPTION</text><rect x="78" y="388" width="598" height="78" rx="6" class="field"/><text x="91" y="413" class="t small">Repair analyzed application exceptions inside the current FlowRun workspace.</text><text x="91" y="434" class="t small">Validate results and update the task ledger with an audit trail.</text>
  <path d="M78 496H676" class="line"/>
  <!-- left context -->
  <text x="78" y="533" class="green mono" font-size="10" font-weight="700">02</text><text x="108" y="535" class="t h">Prompts and context</text><text x="108" y="554" class="muted small">Prompts are editable; Context capabilities are versioned references.</text>
  <rect x="78" y="576" width="598" height="124" rx="8" class="box"/><rect x="78" y="576" width="598" height="32" rx="8" fill="#f6f9f6"/><path d="M78 608H676" class="line"/><text x="91" y="597" class="t small" font-weight="700">Startup prompt</text><text x="566" y="597" class="muted tiny">AUTO INJECTED AT RUN TIME</text><text x="91" y="631" class="t small">Use fix-app-exceptions and find-and-pull-hq-git. Create the err-fix</text><text x="91" y="651" class="t small">workspace, locate each application, repair it and validate the result.</text><text x="91" y="678" class="muted tiny">1,248 characters  ·  Expand editor ↗</text>
  <rect x="78" y="716" width="598" height="124" rx="8" class="box"/><rect x="78" y="716" width="598" height="32" rx="8" fill="#f6f9f6"/><path d="M78 748H676" class="line"/><text x="91" y="737" class="t small" font-weight="700">Context prompt</text><text x="545" y="737" class="muted tiny">NOT A USER MESSAGE</text><text x="91" y="771" class="t small">Preserve an audit trail and validation result for every application.</text><text x="91" y="791" class="t small">Do not push, deploy or change production configuration by default.</text><text x="91" y="818" class="muted tiny">914 characters  ·  Expand editor ↗</text>
  <rect x="78" y="858" width="598" height="58" rx="8" fill="#f1f8f3" stroke="#cde0d3"/><rect x="92" y="874" width="27" height="27" rx="6" fill="#dcefe2"/><text x="105" y="893" text-anchor="middle" class="green" font-family="Arial" font-size="14" font-weight="700">⌘</text><text x="132" y="882" class="t small" font-weight="700">Context capabilities</text><text x="132" y="900" class="muted tiny">2 versions linked · exception policy, repair audit template</text><text x="616" y="890" class="green btn">Manage ›</text>
  <!-- right -->
  <text x="740" y="246" class="t h">Input and output definitions</text><text x="740" y="267" class="muted small">Runtime generates forms and validates delivery strictly from these fields.</text><path d="M708 285H1552" class="line"/>
  <!-- input group -->
  <rect x="740" y="307" width="38" height="20" rx="4" fill="#e6f2fb"/><text x="759" y="321" text-anchor="middle" fill="#356786" class="mono" font-size="9" font-weight="700">INPUT</text><text x="792" y="323" class="t h">Inputs</text><text x="850" y="323" class="muted small">3 fields</text><rect x="1443" y="302" width="81" height="28" rx="6" fill="#fff" stroke="#a8c8b3"/><text x="1483" y="321" text-anchor="middle" class="green btn">+ Add input</text>
  <rect x="740" y="342" width="784" height="178" rx="8" class="box"/><rect x="740" y="342" width="784" height="31" rx="8" fill="#f4f7f5"/>
  <text x="754" y="362" class="muted tiny">FIELD KEY</text><text x="913" y="362" class="muted tiny">DISPLAY NAME</text><text x="1065" y="362" class="muted tiny">TYPE</text><text x="1187" y="362" class="muted tiny">DESCRIPTION</text>
  <path d="M740 373H1524M740 421H1524M740 469H1524" class="line"/>
  <g class="t small"><text x="754" y="403">application_list</text><text x="913" y="403">Target applications</text><text x="1187" y="403">Application list and error index</text><text x="754" y="451">error_summary</text><text x="913" y="451">Exception summary</text><text x="1187" y="451">ERROR / Exception report file</text><text x="754" y="499">run_context</text><text x="913" y="499">Run context</text><text x="1187" y="499">Managed FlowRun workspace</text></g>
  <g><rect x="1065" y="385" width="82" height="23" rx="4" fill="#e4f1e8"/><text x="1086" y="400" class="green tiny" font-weight="700">URL</text><text x="1112" y="400" class="muted tiny">FILE</text><rect x="1065" y="433" width="82" height="23" rx="4" fill="#f0f3f1"/><text x="1086" y="448" class="muted tiny">URL</text><text x="1112" y="448" class="green tiny" font-weight="700">FILE</text><rect x="1065" y="481" width="82" height="23" rx="4" fill="#e4f1e8"/><text x="1086" y="496" class="green tiny" font-weight="700">URL</text><text x="1112" y="496" class="muted tiny">FILE</text><text x="1498" y="403" class="muted" font-family="Arial" font-size="17">×</text><text x="1498" y="451" class="muted" font-family="Arial" font-size="17">×</text><text x="1498" y="499" class="muted" font-family="Arial" font-size="17">×</text></g>
  <text x="742" y="541" class="muted tiny">Field keys are used for flow connections; display names and descriptions form the runtime UI.</text>
  <!-- output group -->
  <rect x="740" y="577" width="43" height="20" rx="4" fill="#e6f4ea"/><text x="761" y="591" text-anchor="middle" fill="#326c48" class="mono" font-size="9" font-weight="700">OUTPUT</text><text x="798" y="593" class="t h">Outputs</text><text x="864" y="593" class="muted small">2 fields</text><rect x="1435" y="572" width="89" height="28" rx="6" fill="#fff" stroke="#a8c8b3"/><text x="1479" y="591" text-anchor="middle" class="green btn">+ Add output</text>
  <rect x="740" y="612" width="784" height="130" rx="8" class="box"/><rect x="740" y="612" width="784" height="31" rx="8" fill="#f4f7f5"/>
  <text x="754" y="632" class="muted tiny">FIELD KEY</text><text x="913" y="632" class="muted tiny">DISPLAY NAME</text><text x="1065" y="632" class="muted tiny">TYPE</text><text x="1187" y="632" class="muted tiny">DESCRIPTION</text><path d="M740 643H1524M740 692H1524" class="line"/>
  <g class="t small"><text x="754" y="674">repair_report</text><text x="913" y="674">Repair report</text><text x="1187" y="674">Changes, verification and blockers</text><text x="754" y="723">task_ledger</text><text x="913" y="723">Task ledger</text><text x="1187" y="723">Complete audit record per application</text></g>
  <g><rect x="1065" y="656" width="82" height="23" rx="4" fill="#f0f3f1"/><text x="1086" y="671" class="muted tiny">URL</text><text x="1112" y="671" class="green tiny" font-weight="700">FILE</text><rect x="1065" y="705" width="82" height="23" rx="4" fill="#f0f3f1"/><text x="1086" y="720" class="muted tiny">URL</text><text x="1112" y="720" class="green tiny" font-weight="700">FILE</text><text x="1498" y="674" class="muted" font-family="Arial" font-size="17">×</text><text x="1498" y="723" class="muted" font-family="Arial" font-size="17">×</text></g>
  <rect x="740" y="775" width="784" height="84" rx="8" fill="#f7faf8" stroke="#d9e4dc"/><text x="757" y="801" class="t small" font-weight="700">When the list grows</text><text x="757" y="821" class="muted small">The input/output column scrolls independently. The primary save action remains visible.</text><rect x="757" y="833" width="122" height="17" rx="8" fill="#e3f0e6"/><text x="818" y="845" text-anchor="middle" class="green tiny" font-weight="700">SCROLLABLE LIST</text>
  <!-- footer -->
  <path d="M708 930H1552" class="line"/><text x="740" y="961" class="muted tiny">Field keys must begin with a letter and contain only letters, digits or underscores.</text><rect x="1353" y="943" width="69" height="34" rx="6" fill="#fff" stroke="#cad6cf"/><text x="1387" y="965" text-anchor="middle" class="t btn">Cancel</text><rect x="1432" y="943" width="92" height="34" rx="6" fill="#176249"/><text x="1478" y="965" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" font-weight="700">Save asset</text>
  <text x="48" y="1034" class="muted" font-family="Arial" font-size="11">Prototype · Desktop layout · Fixed actions / two-column configuration</text>
