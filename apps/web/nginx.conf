server {
  listen 80;
  root /usr/share/nginx/html;
  # Skill ZIPs are sent as Base64 JSON, which adds roughly 33% overhead.
  client_max_body_size 40m;

  # The HTML shell must be revalidated after every deployment so it never
  # references a removed content-hashed JavaScript bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # Vite assets are content-hashed. Cache them forever, but never turn a
  # missing old bundle into index.html (that would surface as a blank page).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
