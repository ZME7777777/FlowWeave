map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker may assign a new address when the API container is recreated. Keep
# resolving the Compose service name instead of retaining Nginx's startup IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream platform_api {
  zone platform_api 64k;
  server api:8080 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  # Skill ZIPs are sent as Base64 JSON, which adds roughly 33% overhead.
  client_max_body_size 40m;

  # The HTML shell must be revalidated after every deployment so it never
  # references a removed content-hashed JavaScript bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # Vite assets are content-hashed. Cache them forever, but never turn a
  # missing old bundle into index.html (that would surface as a blank page).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # The production ingress preserves the /flowweave prefix. Serve the same
  # immutable bundle under that prefix while keeping root-path local
  # development and direct-host access working.
  location /flowweave/assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /flowweave {
    return 301 /flowweave/;
  }

  location /flowweave/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /flowweave/api/ {
    proxy_pass http://platform_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
