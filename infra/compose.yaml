name: flowweave
x-network-plan: &network-plan
  # These CIDRs are FlowWeave-owned only. Production must set all values in
  # /opt/flowweave/.env after checking the target host's routed networks.
  # Dynamic Runtime allocation adopts FLOWWEAVE_RUNTIME_NETWORK_POOL in FR-368.
  FLOWWEAVE_CONTROL_NETWORK_SUBNET: ${FLOWWEAVE_CONTROL_NETWORK_SUBNET:?set a non-overlapping FlowWeave control subnet}
  FLOWWEAVE_DOCKER_CONTROL_NETWORK_SUBNET: ${FLOWWEAVE_DOCKER_CONTROL_NETWORK_SUBNET:?set a non-overlapping FlowWeave Docker-control subnet}
  FLOWWEAVE_RUNTIME_NETWORK_POOL: ${FLOWWEAVE_RUNTIME_NETWORK_POOL:?set a non-overlapping FlowWeave Runtime pool}
  FLOWWEAVE_RUNTIME_NETWORK_PREFIX: ${FLOWWEAVE_RUNTIME_NETWORK_PREFIX:?set a FlowWeave Runtime subnet prefix}
x-platform-env: &platform-env
  <<: *network-plan
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowweave}:${POSTGRES_PASSWORD:-flowweave_dev}@postgres:5432/${POSTGRES_DB:-flowweave}
  RUNTIME_ADAPTER: ${RUNTIME_ADAPTER:-openhands}
  EXECUTION_MODE: worker
  RUNTIME_POLL_SECONDS: ${RUNTIME_POLL_SECONDS:-1}
  RUNTIME_WAKEUP_TIMEOUT_SECONDS: ${RUNTIME_WAKEUP_TIMEOUT_SECONDS:-10}
  RUNTIME_WAKEUP_BACKOFF_MAX_SECONDS: ${RUNTIME_WAKEUP_BACKOFF_MAX_SECONDS:-30}
  OPENHANDS_SESSION_API_KEY: ${OPENHANDS_SESSION_API_KEY:-flowweave-internal}
  AGENT_TASK_TIMEOUT_SECONDS: ${AGENT_TASK_TIMEOUT_SECONDS:-600}
  AGENT_WORKSPACE_RUNTIME_IMAGE: ${AGENT_WORKSPACE_RUNTIME_IMAGE:-flowweave-openhands-runtime:1}
  OPENHANDS_WORKSPACE_ROOT: /workspaces
  RUNTIME_HOST_WORKSPACE_ROOT: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
  IDE_SSH_HOST: ${IDE_SSH_HOST:-}
  IDE_SSH_USER: ${IDE_SSH_USER:-}
  IDE_SSH_PORT: ${IDE_SSH_PORT:-22}
  CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:-}
  FLOWWEAVE_ADMIN_PASSWORD: ${FLOWWEAVE_ADMIN_PASSWORD:-}
  FLOWWEAVE_USER_PASSWORD: ${FLOWWEAVE_USER_PASSWORD:-}
  ARTIFACT_ROOT: /data/artifacts
  WORKSPACE_ROOT: /data/workspaces
  INLINE_ARTIFACT_LIMIT: ${INLINE_ARTIFACT_LIMIT:-65536}
  CAPABILITY_IMPORT_TTL_SECONDS: ${CAPABILITY_IMPORT_TTL_SECONDS:-900}
  TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-30}
  POOL_MAX_OVERFLOW: ${POOL_MAX_OVERFLOW:-0}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-2}
  BLOCKING_POOL_TIMEOUT_SECONDS: ${BLOCKING_POOL_TIMEOUT_SECONDS:-2}
  HISTORY_READ_POOL_SIZE: ${HISTORY_READ_POOL_SIZE:-1}
  SSE_MAX_SUBSCRIBERS: ${SSE_MAX_SUBSCRIBERS:-256}
  SSE_SUBSCRIBER_QUEUE_SIZE: ${SSE_SUBSCRIBER_QUEUE_SIZE:-8}
  RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-}
  RATE_LIMIT_USER_REQUESTS_PER_MINUTE: ${RATE_LIMIT_USER_REQUESTS_PER_MINUTE:-120}
  RATE_LIMIT_CONVERSATION_MESSAGES_PER_MINUTE: ${RATE_LIMIT_CONVERSATION_MESSAGES_PER_MINUTE:-20}

x-docker-client-env: &docker-client-env
  DEPENDENCY_BUILDER_BACKEND: ${DEPENDENCY_BUILDER_BACKEND:-docker}
  DEPENDENCY_BUILDER_IMAGE: ${DEPENDENCY_BUILDER_IMAGE:-flowweave-dependency-builder:1}
  DEPENDENCY_BUILDER_TIMEOUT_SECONDS: ${DEPENDENCY_BUILDER_TIMEOUT_SECONDS:-300}
  PLUGIN_RESOLVER_BACKEND: ${PLUGIN_RESOLVER_BACKEND:-docker}
  PLUGIN_RESOLVER_IMAGE: ${PLUGIN_RESOLVER_IMAGE:-flowweave-openhands-runtime:1}
  PLUGIN_RESOLVER_TIMEOUT_SECONDS: ${PLUGIN_RESOLVER_TIMEOUT_SECONDS:-300}
  PLUGIN_RESOLVER_ALLOWED_HOSTS: ${PLUGIN_RESOLVER_ALLOWED_HOSTS:-github.com,gitlab.com}
  TERMINAL_ENVIRONMENT_BACKEND: ${TERMINAL_ENVIRONMENT_BACKEND:-docker}
  TERMINAL_ENVIRONMENT_SETUP_IMAGE: ${TERMINAL_ENVIRONMENT_SETUP_IMAGE:-flowweave-openhands-runtime:1}
  OPENHANDS_RUNTIME_BUILDER_IMAGE: ${OPENHANDS_RUNTIME_BUILDER_IMAGE:-flowweave-openhands-runtime:1}
  TERMINAL_ENVIRONMENT_CLEANUP_SECONDS: ${TERMINAL_ENVIRONMENT_CLEANUP_SECONDS:-30}
  USAGE_RECONCILIATION_SECONDS: ${USAGE_RECONCILIATION_SECONDS:-300}
  USAGE_RECONCILIATION_RETRY_SECONDS: ${USAGE_RECONCILIATION_RETRY_SECONDS:-30}
  USAGE_RECONCILIATION_BATCH_SIZE: ${USAGE_RECONCILIATION_BATCH_SIZE:-5}
  SANDBOX_BACKEND: docker
  SANDBOX_IMAGE_PYTHON: flowweave-sandbox-python:1
  SANDBOX_IMAGE_JAVASCRIPT: flowweave-sandbox-javascript:1
  SANDBOX_MANAGER_SCOPE: ${SANDBOX_MANAGER_SCOPE:-flowweave-local}
  SANDBOX_RECONCILE_SECONDS: ${SANDBOX_RECONCILE_SECONDS:-30}
  SANDBOX_RECONCILE_BATCH_SIZE: ${SANDBOX_RECONCILE_BATCH_SIZE:-50}
  SANDBOX_ORPHAN_GRACE_SECONDS: ${SANDBOX_ORPHAN_GRACE_SECONDS:-300}
  SANDBOX_RUNTIME_IDLE_TTL_SECONDS: ${SANDBOX_RUNTIME_IDLE_TTL_SECONDS:-3600}
  SANDBOX_RUNTIME_HARD_TTL_SECONDS: ${SANDBOX_RUNTIME_HARD_TTL_SECONDS:-86400}
  SANDBOX_RUNTIME_NETWORK_MODE: ${SANDBOX_RUNTIME_NETWORK_MODE:?set isolated or egress explicitly}
  SANDBOX_STORAGE_SIZE: ${SANDBOX_STORAGE_SIZE:-4g}
  TERMINAL_ENVIRONMENT_MAX_ACTIVE_SESSIONS: ${TERMINAL_ENVIRONMENT_MAX_ACTIVE_SESSIONS:-4}
  DOCKER_CONTROLLER_MODE: remote
  DOCKER_CONTROLLER_URL: http://runtime-provider:8090

services:
  workspace-init:
    image: flowweave-alpine:3.22-amd64
    build: { context: .., dockerfile: infra/alpine/Dockerfile }
    command: ["sh", "-c", "mkdir -p /data/artifacts /data/workspaces/nodes && chown -R 10001:10001 /data/artifacts && chmod -R u+rwX /data/artifacts && chmod 0777 /data/workspaces /data/workspaces/nodes"]
    volumes:
      - artifacts:/data/artifacts
      - type: bind
        source: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
        target: /data/workspaces
    restart: "no"

  postgres:
    image: flowweave-postgres:16.9-amd64
    build: { context: .., dockerfile: infra/postgres/Dockerfile }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowweave}
      POSTGRES_USER: ${POSTGRES_USER:-flowweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowweave_dev}
    ports: ["${FLOWWEAVE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migration:
    build: { context: .., dockerfile: services/platform/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: *platform-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    init: true
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 128

  runtime-provider:
    build: { context: .., dockerfile: services/platform/Dockerfile }
    command: ["uvicorn", "flowweave.bootstrap.runtime_provider:create_app", "--host", "0.0.0.0", "--port", "8090", "--factory"]
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    init: true
    cpus: "1.0"
    mem_limit: 1536m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      <<: *network-plan
      OPENHANDS_SESSION_API_KEY: ${OPENHANDS_SESSION_API_KEY:-flowweave-internal}
      OPENHANDS_WORKSPACE_ROOT: /workspaces
      FLOW_RUN_RUNTIME_VALIDATION_ROOT: /runtime-storage
      RUNTIME_HOST_WORKSPACE_ROOT: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
      # Optional host Maven root. When set, it must include Repository and
      # conf/settings.xml and is re-mounted read-only into dynamic Runtimes.
      MAVEN_SHARED_HOST_ROOT: ${MAVEN_SHARED_HOST_ROOT:-}
      DEPENDENCY_BUILDER_BACKEND: docker
      DEPENDENCY_BUILDER_IMAGE: ${DEPENDENCY_BUILDER_IMAGE:-flowweave-dependency-builder:1}
      DEPENDENCY_BUILDER_TIMEOUT_SECONDS: ${DEPENDENCY_BUILDER_TIMEOUT_SECONDS:-300}
      PLUGIN_RESOLVER_BACKEND: docker
      PLUGIN_RESOLVER_IMAGE: ${PLUGIN_RESOLVER_IMAGE:-flowweave-openhands-runtime:1}
      PLUGIN_RESOLVER_TIMEOUT_SECONDS: ${PLUGIN_RESOLVER_TIMEOUT_SECONDS:-300}
      PLUGIN_RESOLVER_ALLOWED_HOSTS: ${PLUGIN_RESOLVER_ALLOWED_HOSTS:-github.com,gitlab.com}
      TERMINAL_ENVIRONMENT_BACKEND: docker
      TERMINAL_ENVIRONMENT_SETUP_IMAGE: ${TERMINAL_ENVIRONMENT_SETUP_IMAGE:-flowweave-openhands-runtime:1}
      OPENHANDS_RUNTIME_BUILDER_IMAGE: ${OPENHANDS_RUNTIME_BUILDER_IMAGE:-flowweave-openhands-runtime:1}
      SANDBOX_MANAGER_SCOPE: ${SANDBOX_MANAGER_SCOPE:-flowweave-local}
      SANDBOX_ORPHAN_GRACE_SECONDS: ${SANDBOX_ORPHAN_GRACE_SECONDS:-300}
      SANDBOX_RUNTIME_NETWORK_MODE: ${SANDBOX_RUNTIME_NETWORK_MODE:?set isolated or egress explicitly}
      SANDBOX_STORAGE_SIZE: ${SANDBOX_STORAGE_SIZE:-4g}
      TERMINAL_ENVIRONMENT_MAX_ACTIVE_SESSIONS: ${TERMINAL_ENVIRONMENT_MAX_ACTIVE_SESSIONS:-4}
      DOCKER_CONTROLLER_TERMINAL_IDLE_SECONDS: ${DOCKER_CONTROLLER_TERMINAL_IDLE_SECONDS:-1800}
      DOCKER_CONTROLLER_TERMINAL_HARD_TTL_SECONDS: ${DOCKER_CONTROLLER_TERMINAL_HARD_TTL_SECONDS:-28800}
      RUNTIME_RELAY_MAX_HUBS: ${RUNTIME_RELAY_MAX_HUBS:-128}
      RUNTIME_RELAY_MAX_SUBSCRIBERS: ${RUNTIME_RELAY_MAX_SUBSCRIBERS:-8}
      RUNTIME_RELAY_SUBSCRIBER_QUEUE_SIZE: ${RUNTIME_RELAY_SUBSCRIBER_QUEUE_SIZE:-32}
      RUNTIME_RELAY_IDLE_GRACE_SECONDS: ${RUNTIME_RELAY_IDLE_GRACE_SECONDS:-300}
      DOCKER_CONTROLLER_MODE: local
      DOCKER_CONTROLLER_API_KEY: ${DOCKER_CONTROLLER_API_KEY:?set a random API controller key with at least 32 characters}
      DOCKER_CONTROLLER_WORKER_API_KEY: ${DOCKER_CONTROLLER_WORKER_API_KEY:?set a different random Worker controller key with at least 32 characters}
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE_PYTHON: flowweave-sandbox-python:1
      SANDBOX_IMAGE_JAVASCRIPT: flowweave-sandbox-javascript:1
    # Docker Desktop exposes the socket with GID 0. Linux hosts should set
    # DOCKER_SOCKET_GID to the numeric group owning /var/run/docker.sock.
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
        target: /runtime-storage
        read_only: true
      # Keep this path identical inside the Provider so it validates the
      # Docker-host source before mounting it into dynamic Runtimes. The /dev/null
      # fallback is inert whenever Maven sharing is disabled.
      - type: bind
        source: ${MAVEN_SHARED_HOST_ROOT:-/dev/null}
        target: ${MAVEN_SHARED_HOST_ROOT:-/maven-disabled}
        read_only: true
    depends_on:
      workspace-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - docker-control

  api:
    build: { context: .., dockerfile: services/platform/Dockerfile }
    user: "10001:10001"
    init: true
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    command: ["uvicorn", "flowweave.bootstrap.api:create_app", "--host", "0.0.0.0", "--port", "8080", "--factory", "--workers", "4"]
    environment:
      <<: [*platform-env, *docker-client-env]
      # Four independent REST workers prevent one process failure from taking
      # out the control plane. Keep each worker's async and blocking pools small
      # so the aggregate PostgreSQL and Runtime concurrency remains bounded.
      POOL_SIZE: 8
      POOL_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT_SECONDS: 2
      # Current execution state uses the interactive lane; older conversation
      # pages use a separate one-connection history lane. Four interactive
      # reads per API worker prevent a slow Runtime page from starving reload.
      BLOCKING_POOL_SIZE: 4
      HISTORY_READ_POOL_SIZE: 1
      BLOCKING_POOL_TIMEOUT_SECONDS: 2
      DOCKER_CONTROLLER_API_KEY: ${DOCKER_CONTROLLER_API_KEY:?set a random API controller key with at least 32 characters}
    labels:
      flowweave.runtime-client: "true"
      flowweave.runtime-client-role: "api"
      flowweave.manager-scope: "${SANDBOX_MANAGER_SCOPE:-flowweave-local}"
    ports: ["${FLOWWEAVE_BIND_ADDRESS:-127.0.0.1}:8080:8080"]
    volumes:
      - artifacts:/data/artifacts
      - type: bind
        source: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
        target: /data/workspaces
    depends_on:
      migration: { condition: service_completed_successfully }
      runtime-provider: { condition: service_healthy }
      workspace-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - docker-control

  # Long-lived browser WebSockets must not share the REST API process. A slow
  # Agent Runtime stream can therefore never prevent workspace, flow, or
  # capability HTTP reads from receiving a response. The web proxy sends only
  # Upgrade requests for the explicit stream and terminal routes here.
  stream-api:
    build: { context: .., dockerfile: services/platform/Dockerfile }
    user: "10001:10001"
    init: true
    cpus: "2.0"
    mem_limit: 1536m
    pids_limit: 256
    command: ["uvicorn", "flowweave.bootstrap.api:create_app", "--host", "0.0.0.0", "--port", "8080", "--factory", "--workers", "4"]
    environment:
      <<: [*platform-env, *docker-client-env]
      # A stream worker only reads a Runtime handle before it begins the
      # WebSocket relay. Keep its per-process pool bounded even when many
      # browser sessions are connected. REST owns its separate API pool.
      POOL_SIZE: 4
      POOL_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT_SECONDS: 2
      BLOCKING_POOL_SIZE: 1
      HISTORY_READ_POOL_SIZE: 1
      BLOCKING_POOL_TIMEOUT_SECONDS: 2
      DOCKER_CONTROLLER_API_KEY: ${DOCKER_CONTROLLER_API_KEY:?set a random API controller key with at least 32 characters}
    labels:
      flowweave.runtime-client: "true"
      flowweave.runtime-client-role: "api"
      flowweave.manager-scope: "${SANDBOX_MANAGER_SCOPE:-flowweave-local}"
    volumes:
      - artifacts:/data/artifacts
      - type: bind
        source: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
        target: /data/workspaces
    depends_on:
      migration: { condition: service_completed_successfully }
      runtime-provider: { condition: service_healthy }
      workspace-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - default
      - docker-control

  worker:
    build: { context: .., dockerfile: services/platform/Dockerfile }
    user: "10001:10001"
    init: true
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    command: ["python", "-m", "flowweave.bootstrap.worker"]
    environment:
      <<: [*platform-env, *docker-client-env]
      # One worker process owns a bounded 8-connection request pool plus
      # separate blocking/control pools. Overflow remains disabled so the
      # process cannot exceed its database connection budget under load.
      POOL_SIZE: 8
      POOL_MAX_OVERFLOW: 0
      DATABASE_POOL_TIMEOUT_SECONDS: 2
      BLOCKING_POOL_SIZE: 4
      HISTORY_READ_POOL_SIZE: 1
      BLOCKING_POOL_TIMEOUT_SECONDS: 2
      DOCKER_CONTROLLER_API_KEY: ${DOCKER_CONTROLLER_WORKER_API_KEY:?set a different random Worker controller key with at least 32 characters}
    labels:
      flowweave.runtime-client: "true"
      flowweave.runtime-client-role: "worker"
      flowweave.manager-scope: "${SANDBOX_MANAGER_SCOPE:-flowweave-local}"
    volumes:
      - artifacts:/data/artifacts
      - type: bind
        source: ${FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT:?set FLOWWEAVE_RUNTIME_HOST_WORKSPACE_ROOT to an absolute workspace path}
        target: /data/workspaces
    depends_on:
      migration: { condition: service_completed_successfully }
      runtime-provider: { condition: service_healthy }
      workspace-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks:
      - default
      - docker-control

  dependency-builder-image:
    image: flowweave-dependency-builder:1
    build: { context: .., dockerfile: infra/dependency-builder/Dockerfile }
    command: ["python", "-c", "print('dependency builder image ready')"]
    network_mode: none
    restart: "no"

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    init: true
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 64
    ports: ["${FLOWWEAVE_BIND_ADDRESS:-127.0.0.1}:5173:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  artifacts:

networks:
  default:
    name: flowweave_control
    ipam:
      config:
        - subnet: ${FLOWWEAVE_CONTROL_NETWORK_SUBNET:?set a non-overlapping FlowWeave control subnet}
  docker-control:
    name: flowweave_docker_control
    internal: true
    ipam:
      config:
        - subnet: ${FLOWWEAVE_DOCKER_CONTROL_NETWORK_SUBNET:?set a non-overlapping FlowWeave Docker-control subnet}
