[project]
name = "flowweave-openhands-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "openhands-agent-server==1.58.2",
  "openhands-sdk==1.58.2",
  "openhands-workspace==1.58.2",
  "openhands-tools==1.58.2",
]

[dependency-groups]
source-build = ["setuptools>=83.0.0", "wheel"]

[tool.uv]
exclude-newer = "7 days"
# Preserve the fixed baseline's named cutoffs, including its CA distrust fix.
exclude-newer-package = { litellm = "2026-07-20T00:00:00Z", lmnr = "2026-08-23T00:00:00Z", certifi = "2026-10-21T00:00:00Z", pip = "2026-10-21T00:00:00Z", openhands-agent-server = "2026-10-25T04:00:00Z", openhands-sdk = "2026-10-25T04:00:00Z", openhands-tools = "2026-10-25T04:00:00Z", openhands-workspace = "2026-10-25T04:00:00Z" }
constraint-dependencies = [
  "nodejs-wheel-binaries>=24,<25",
  "starlette>=0.49.1",
  "aiohttp>=3.13.3",
  "urllib3>=2.8.0",
  "protobuf>=6.33.5",
  "pillow>=12.3.0",
  "orjson>=3.11.7",
  "rich>=14.3.3",
  "lupa>=2.8",
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "litellm==1.93.0",
  "anyio>=4.14.2",
  "pyjwt>=2.14.0"
]
